ight="60" rx="18" fill="url(#glassG)" pointer-events="none"/><text x="326" y="606" class="h2">Quota de publication</text><text x="326" y="630" class="sub">Le quota YouTube s’applique à la plateforme, pas à chaque workspace.</text><text x="326" y="700" class="num">18</text><text x="408" y="690" class="sub">publications aujourd’hui</text><text x="408" y="710" class="mut">sur ~100 disponibles</text><rect x="326" y="724" width="670" height="8" rx="4.0" fill="#232329"/><rect x="326" y="724" width="120.6" height="8" rx="4.0" fill="url(#barG)"/><text x="326" y="758" class="mut">Depuis juin 2026, les envois disposent de leur propre quota (~100 appels/jour).</text><rect x="1050" y="566" width="350" height="220" rx="18" fill="url(#cardG)" stroke="#26262C" filter="url(#shadow)"/><rect x="1050" y="566" width="350" height="60" rx="18" fill="url(#glassG)" pointer-events="none"/><text x="1078" y="606" class="h2">Sécurité des jetons</text><rect x="1082" y="628" width="16" height="16" rx="5" fill="#32D74B"/><path d="M1086 636 l3 3 5.5-6" fill="none" stroke="#08080A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="1110" y="641" class="sub">Chiffrés AES-256-GCM au repos</text><rect x="1082" y="662" width="16" height="16" rx="5" fill="#32D74B"/><path d="M1086 670 l3 3 5.5-6" fill="none" stroke="#08080A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="1110" y="675" class="sub">Jamais écrits dans les journaux</text><rect x="1082" y="696" width="16" height="16" rx="5" fill="#32D74B"/><path d="M1086 704 l3 3 5.5-6" fill="none" stroke="#08080A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="1110" y="709" class="sub">Révocation exposée dans l’UI</text><rect x="1082" y="730" width="16" height="16" rx="5" fill="#32D74B"/><path d="M1086 738 l3 3 5.5-6" fill="none" stroke="#08080A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="1110" y="743" class="sub">Rotation de clé = reconnexion</text><rect x="298" y="827" width="3" height="14" rx="1.5" fill="#FF3B30"/><text x="310" y="838" class="lbl">ÉTAT VIDE</text><rect x="298" y="858" width="1102" height="128" rx="18" fill="#131316" stroke="#1C1C21"/><rect x="298" y="858" width="1102" height="60" rx="18" fill="url(#glassG)" pointer-events="none"/><g transform="translate(834,890) scale(1.3)"><g fill="none" stroke="#5C5C66" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.2" y="5" width="19.6" height="14" rx="4.4"/><path d="M10 9.4l5.4 2.6-5.4 2.6z"/></g></g><text x="849" y="944" class="h3" text-anchor="middle">Aucune chaîne connectée</text><text x="849" y="966" class="sub" text-anchor="middle">Connecte ta chaîne pour publier depuis GenTube. Tu peux en connecter plusieurs.</text></svg>