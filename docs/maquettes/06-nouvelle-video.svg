x="326" y="360" width="670" height="92" rx="10" fill="#0C0C0F" stroke="#2E2E36"/><text x="340" y="384" font-size="13.5" fill="#FFFFFF">Les femmes guerrières du royaume du Dahomey, de leur</text><text x="340" y="404" font-size="13.5" fill="#FFFFFF">fondation à la conquête française.</text><text x="326" y="484" class="lbl">RÉSOLUTION</text><rect x="326" y="498" width="326" height="68" rx="12" fill="#0F0F13" stroke="#FF3B30"/><circle cx="352" cy="532" r="8.5" fill="#0C0C0F" stroke="#FF3B30" stroke-width="2"/><circle cx="352" cy="532" r="4" fill="#FF3B30"/><text x="374" y="526" class="h2">480p</text><text x="374" y="548" class="sub">1 crédit par seconde</text><rect x="614" y="524" width="16" height="16" rx="5" fill="#FF3B30"/><path d="M618 532 l3 3 5.5-6" fill="none" stroke="#08080A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="670" y="498" width="326" height="68" rx="12" fill="#0F0F13" stroke="#1C1C21"/><circle cx="696" cy="532" r="8.5" fill="#0C0C0F" stroke="#3A3A44" stroke-width="1.4"/><text x="718" y="526" class="h2">720p</text><text x="718" y="548" class="sub">3 crédits par seconde</text><text x="326" y="602" class="lbl">PIPELINE</text><rect x="326" y="616" width="670" height="44" rx="10" fill="#0C0C0F" stroke="#2A2A31"/><rect x="330.0" y="620" width="162.5" height="36" rx="7" fill="#212127" stroke="#3A3A44" filter="url(#shadowSm)"/><text x="411.2" y="642.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Hériter du projet · mixte</text><text x="577.8" y="642.5" font-size="12.5" font-weight="600" fill="#8B8B95" text-anchor="middle">Images</text><text x="744.2" y="642.5" font-size="12.5" font-weight="600" fill="#8B8B95" text-anchor="middle">Vidéo</text><text x="910.8" y="642.5" font-size="12.5" font-weight="600" fill="#8B8B95" text-anchor="middle">Mixte</text><g><rect x="326" y="690" width="300" height="52" rx="12" fill="url(#red)" stroke="none" filter="url(#glowRed)"/><rect x="326" y="690" width="300" height="26.0" rx="12" fill="url(#glassG)"/><text x="476.0" y="720.5" class="btnT" fill="#FFFFFF" text-anchor="middle">Créer la vidéo</text></g><text x="646" y="722" class="sub">Aucun crédit n’est débité à cette étape.</text><rect x="1050" y="186" width="350" height="400" rx="18" fill="url(#cardG)" stroke="#26262C" filter="url(#shadow)"/><rect x="1050" y="186" width="350" height="60" rx="18" fill="url(#glassG)" pointer-events="none"/><text x="1078" y="226" class="h2">Ce qui va se passer</text><circle cx="1094" cy="276" r="13" fill="#FF3B30" fill-opacity=".14" stroke="#FF3B30" stroke-opacity=".3"/><text x="1094" y="280" font-size="11" font-weight="800" fill="#FF3B30" text-anchor="middle">1</text><line x1="1094" y1="292" x2="1094" y2="322" stroke="#26262C" stroke-dasharray="3 3"/><text x="1120" y="274" class="h3">Le modèle écrit le storyboard</text><text x="1120" y="294" class="sub">quelques secondes</text><circle cx="1094" cy="350" r="13" fill="#FF3B30" fill-opacity=".14" stroke="#FF3B30" stroke-opacity=".3"/><text x="1094" y="354" font-size="11" font-weight="800" fill="#FF3B30" text-anchor="middle">2</text><line x1="1094" y1="366" x2="1094" y2="396" stroke="#26262C" stroke-dasharray="3 3"/><text x="1120" y="348" class="h3">La voix de mesure lit chaque scène</text><text x="1120" y="368" class="sub">gratuit</text><circle cx="1094" cy="424" r="13" fill="#FF3B30" fill-opacity=".14" stroke="#FF3B30" stroke-opacity=".3"/><text x="1094" y="428" font-size="11" font-weight="800" fill="#FF3B30" text-anchor="middle">3</text><line x1="1094" y1="440" x2="1094" y2="470" stroke="#26262C" stroke-dasharray="3 3"/><text x="1120" y="422" class="h3">Le prix exact s’affiche</text><text x="1120" y="442" class="sub">tu valides ou tu ajustes</text><circle cx="1094" cy="498" r="13" fill="#FF3B30" fill-opacity=".14" stroke="#FF3B30" stroke-opacity=".3"/><text x="1094" y="502" font-size="11" font-weight="800" fill="#FF3B30" text-anchor="middle">4</text><text x="1120" y="496" class="h3">Débit des crédits</text><text x="1120" y="516" class="sub">une seule fois, figé</text><rect x="1050" y="606" width="350" height="200" rx="18" fill="#131316" stroke="#26262C"/><rect x="1050" y="606" width="350" height="60" rx="18" fill="url(#glassG)" pointer-events="none"/><text x="1078" y="646" class="lbl">Solde du workspace</text><text x="1078" y="692" class="num">5 400</text><text x="1078" y="716" class="sub">crédits ≈ 45 min animées en 480p</text><rect x="1078" y="736" width="294" height="8" rx="4.0" fill="#232329"/><rect x="1078" y="736" width="188.2" height="8" rx="4.0" fill="url(#barG)"/><text x="1078" y="768" class="mut">Le débit aura lieu à la validation du storyboard.</text></svg>