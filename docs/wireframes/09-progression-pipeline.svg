<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" font-family="Plus Jakarta Sans, Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A4E"/><stop offset="1" stop-color="#CC0000"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f1d1d"/><stop offset=".55" stop-color="#FF1E1E"/><stop offset="1" stop-color="#FF9A9A"/>
    </linearGradient>
  </defs>
  <style>
    .h1{font-size:21px;font-weight:800;fill:#fff}
    .h2{font-size:15px;font-weight:700;fill:#fff}
    .body{font-size:13px;fill:#E8E8ED}
    .sub{font-size:12px;fill:#A5A5AA}
    .mut{font-size:11px;fill:#8A8A92}
    .tiny{font-size:10px;fill:#4A4A4A}
    .lbl{font-size:10px;font-weight:700;fill:#6E6E73;letter-spacing:.12em}
    .nav{font-size:13px;font-weight:600;fill:#A5A5AA}
    .navOn{font-size:13px;font-weight:700;fill:#fff}
    .card{fill:#1C1C1E;stroke:#2A2A2D}
    .ghost{fill:none;stroke:#3A3A3E}
    .link{font-size:12px;font-weight:700;fill:#FF453A}
  </style>
  <rect width="1440" height="1240" fill="#000000"/>

  <rect width="1440" height="64" fill="#000"/>
  <line x1="0" y1="64" x2="1440" y2="64" stroke="#1F1F22"/>
  <g transform="translate(40,16)">
    <rect width="32" height="32" rx="9" fill="url(#red)"/>
    <path d="M13 9 L23 16 L13 23 Z" fill="#fff"/>
    <text x="42" y="23" font-size="17" font-weight="800" fill="#fff">Gen<tspan fill="#FF453A">Tube</tspan></text>
  </g>
  <g transform="translate(1120,17)">
    <rect width="150" height="30" rx="15" fill="#1C1C1E" stroke="#2E2E32"/>
    <path d="M14 7 l4 3 -1.5 5 -5 0 -1.5 -5 z" fill="#FF453A"/>
    <text x="34" y="20" font-size="12" font-weight="800" fill="#fff">2 500</text>
    <text x="86" y="20" font-size="9" font-weight="700" fill="#FF453A">GET MORE</text>
  </g>
  <circle cx="1388" cy="32" r="17" fill="#2E2E30"/>
  <text x="1388" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">AM</text>

  <rect x="0" y="64" width="256" height="1176" fill="#0B0B0C"/>
  <line x1="256" y1="64" x2="256" y2="1240" stroke="#1F1F22"/>
  <g stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(30,98)" stroke="#6E6E73"><circle cx="9" cy="7" r="3.2"/><path d="M3 18c0-3.6 2.7-6 6-6s6 2.4 6 6"/><circle cx="16.5" cy="8" r="2.5"/><path d="M16 12.4c2.8.4 4.6 2.5 4.6 5.6"/></g>
    <text x="62" y="113" class="nav">Équipe</text>
    <rect x="14" y="134" width="228" height="40" rx="10" fill="#1C1C1E"/>
    <g transform="translate(30,144)" stroke="#FF453A"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M10 9l6 3.5-6 3.5z"/></g>
    <text x="62" y="159" class="navOn">Projets</text>
    <g transform="translate(30,190)" stroke="#6E6E73"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></g>
    <text x="62" y="205" class="nav">Général</text>
    <g transform="translate(30,236)" stroke="#6E6E73"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/></g>
    <text x="62" y="251" class="nav">Facturation</text>
    <g transform="translate(30,282)" stroke="#6E6E73"><path d="M2.5 12h4l3-7 4.5 14 3-7h4.5"/></g>
    <text x="62" y="297" class="nav">Activité</text>
    <g transform="translate(30,328)" stroke="#6E6E73"><path d="M12 3l8 3v5.5c0 5-3.2 8.3-8 10-4.8-1.7-8-5-8-10V6z"/></g>
    <text x="62" y="343" class="nav">Sécurité</text>
  </g>

  <text x="296" y="110" class="link">←  Histoires du Bénin</text>
  <text x="296" y="144" class="h1">Les Amazones du Dahomey</text>
  <rect x="530" y="126" width="130" height="24" rx="12" fill="#FFD60A" fill-opacity=".13"/>
  <circle cx="544" cy="138" r="3" fill="#FFD60A"/>
  <text x="552" y="142" font-size="11" font-weight="600" fill="#FFD60A">en génération</text>
  <text x="1400" y="142" text-anchor="end" class="mut">480p · 16:9 · pipeline mixte</text>

  <!-- progression globale -->
  <g transform="translate(296,168)">
    <rect width="1104" height="120" rx="14" class="card"/>
    <text x="24" y="38" class="h2">8 plans sur 15 prêts</text>
    <text x="1080" y="38" text-anchor="end" class="mut">encore quelques minutes — tu peux quitter cette page, on t'attend ici au retour.</text>
    <rect x="24" y="58" width="1056" height="10" rx="5" fill="#2A2A2D"/>
    <rect x="24" y="58" width="563" height="10" rx="5" fill="url(#bar)"/>
    <text x="24" y="96" class="tiny">Les clips sont générés en parallèle : 30–40 s par plan en 480p, ~150 s en 720p.</text>
  </g>

  <!-- étapes -->
  <g transform="translate(296,312)">
    <rect width="1104" height="260" rx="14" class="card"/>
    <text x="24" y="38" class="h2">Pipeline</text>
    <g transform="translate(24,64)">
      <circle cx="18" cy="18" r="14" fill="#32D74B" fill-opacity=".13"/><text x="18" y="23" text-anchor="middle" font-size="12" fill="#32D74B">✓</text>
      <text x="48" y="23" class="body" font-weight="700">Voix off</text>
      <rect x="880" y="6" width="76" height="22" rx="11" fill="#32D74B" fill-opacity=".13"/>
      <text x="918" y="21" text-anchor="middle" font-size="10" font-weight="700" fill="#32D74B">terminé</text>
      <text x="1056" y="21" text-anchor="end" class="tiny">14:02</text>
    </g>
    <line x1="24" y1="112" x2="1080" y2="112" stroke="#26262A"/>
    <g transform="translate(24,122)">
      <circle cx="18" cy="18" r="14" fill="none" stroke="#FFD60A" stroke-width="2" stroke-dasharray="52 36"/>
      <text x="48" y="23" class="body" font-weight="700">Plans (images et clips)</text>
      <text x="240" y="23" class="mut">8/15 générés</text>
      <rect x="868" y="6" width="88" height="22" rx="11" fill="#FFD60A" fill-opacity=".13"/>
      <text x="912" y="21" text-anchor="middle" font-size="10" font-weight="700" fill="#FFD60A">en cours</text>
    </g>
    <line x1="24" y1="170" x2="1080" y2="170" stroke="#26262A"/>
    <g transform="translate(24,180)">
      <circle cx="18" cy="18" r="14" fill="#141416" stroke="#3A3A3E"/><text x="18" y="23" text-anchor="middle" font-size="12" fill="#6E6E73">3</text>
      <text x="48" y="23" class="body" font-weight="700">Assemblage (Hyperframes + Lambda)</text>
      <rect x="868" y="6" width="88" height="22" rx="11" fill="#8E8E93" fill-opacity=".15"/>
      <text x="912" y="21" text-anchor="middle" font-size="10" font-weight="700" fill="#C9C9CE">en attente</text>
    </g>
    <line x1="24" y1="228" x2="1080" y2="228" stroke="#26262A"/>
    <g transform="translate(24,238)" opacity=".9">
      <circle cx="18" cy="18" r="14" fill="#141416" stroke="#3A3A3E"/><text x="18" y="23" text-anchor="middle" font-size="12" fill="#6E6E73">4</text>
      <text x="48" y="23" class="body" font-weight="700">Publication YouTube</text>
      <rect x="868" y="6" width="88" height="22" rx="11" fill="#8E8E93" fill-opacity=".15"/>
      <text x="912" y="21" text-anchor="middle" font-size="10" font-weight="700" fill="#C9C9CE">en attente</text>
    </g>
  </g>

  <!-- liste des plans -->
  <g transform="translate(296,596)">
    <rect width="1104" height="330" rx="14" class="card"/>
    <text x="24" y="38" class="h2">Les plans</text>
    <g transform="translate(24,60)">
      <text x="0" y="20" class="sub" font-weight="700">#1 · image · 5,28 s</text>
      <text x="0" y="40" class="mut" font-size="10">Au XVIIᵉ siècle, un royaume d'Afrique de l'Ouest…</text>
      <rect x="920" y="4" width="56" height="22" rx="11" fill="#32D74B" fill-opacity=".13"/>
      <text x="948" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#32D74B">prêt</text>
    </g>
    <line x1="24" y1="112" x2="1080" y2="112" stroke="#26262A"/>
    <g transform="translate(24,122)">
      <text x="0" y="20" class="sub" font-weight="700">#2 · vidéo · 5,1 s</text>
      <text x="0" y="40" class="mut" font-size="10">On les appelle les Amazones. Elles s'entraînent chaque jour…</text>
      <rect x="920" y="4" width="56" height="22" rx="11" fill="#32D74B" fill-opacity=".13"/>
      <text x="948" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#32D74B">prêt</text>
    </g>
    <line x1="24" y1="174" x2="1080" y2="174" stroke="#26262A"/>
    <g transform="translate(24,184)">
      <text x="0" y="20" class="sub" font-weight="700">#3 · vidéo · 4,8 s</text>
      <text x="0" y="40" class="mut" font-size="10">Pendant deux ans, elles ont tenu tête à l'armée française.</text>
      <circle cx="934" cy="15" r="9" fill="none" stroke="#FFD60A" stroke-width="2" stroke-dasharray="34 22"/>
      <text x="954" y="19" font-size="10" font-weight="700" fill="#FFD60A">en cours</text>
    </g>
    <line x1="24" y1="236" x2="1080" y2="236" stroke="#26262A"/>
    <g transform="translate(24,246)">
      <text x="0" y="20" class="sub" font-weight="700">#5 · vidéo · 6,2 s</text>
      <text x="0" y="40" class="mut" font-size="10">Aujourd'hui, il ne reste que des murs. Et leur nom.</text>
      <rect x="700" y="2" width="150" height="26" rx="8" fill="none" stroke="#FF453A" stroke-opacity=".65"/>
      <text x="775" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#FF453A">Relancer ce plan</text>
      <rect x="920" y="4" width="56" height="22" rx="11" fill="#FF453A" fill-opacity=".13"/>
      <text x="948" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#FF453A">échec</text>
      <text x="0" y="62" font-size="10" fill="#FF8A80" font-family="monospace">ProviderError: capacity exceeded (wan-2.2-fast) — tentative 2/3…</text>
    </g>
  </g>

  <!-- échec global -->
  <text x="296" y="972" class="lbl">VARIANTE · ÉCHEC GLOBAL DU PIPELINE</text>
  <g transform="translate(296,988)">
    <rect width="1104" height="180" rx="14" fill="#1C1C1E" stroke="#FF453A" stroke-opacity=".35"/>
    <rect x="24" y="24" width="1056" height="44" rx="10" fill="#FF453A" fill-opacity=".1" stroke="#FF453A" stroke-opacity=".45"/>
    <text x="40" y="51" font-size="12" font-weight="700" fill="#FF8A80">✕  Le pipeline a échoué après 3 tentatives sur le plan #5. Les 60 crédits consommés ont été remboursés sur ton solde.</text>
    <rect x="24" y="92" width="290" height="44" rx="10" fill="none" stroke="#FF453A" stroke-opacity=".65"/>
    <text x="169" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#FF453A">Remettre en brouillon pour corriger</text>
    <text x="334" y="119" class="mut" font-size="11">→ tu retrouves le storyboard intact, tu corriges le plan en échec, tu revalides.</text>
  </g>
</svg>
