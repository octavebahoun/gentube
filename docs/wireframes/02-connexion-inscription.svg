<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" font-family="Plus Jakarta Sans, Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A4E"/><stop offset="1" stop-color="#CC0000"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF0000" stop-opacity=".18"/><stop offset="1" stop-color="#FF0000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .h2{font-size:18px;font-weight:800;fill:#fff}
    .body{font-size:13px;fill:#E8E8ED}
    .sub{font-size:12px;fill:#A5A5AA}
    .mut{font-size:11px;fill:#8A8A92}
    .tiny{font-size:10px;fill:#4A4A4A}
    .lbl{font-size:11px;font-weight:600;fill:#8A8A92;letter-spacing:.08em}
    .btnT{font-size:14px;font-weight:700;fill:#fff}
    .card{fill:#1C1C1E;stroke:#2A2A2D}
    .field{fill:#0A0A0B;stroke:#2E2E32}
    .ghost{fill:none;stroke:#3A3A3E}
    .err{font-size:12px;font-weight:600;fill:#FF453A}
  </style>
  <rect width="1440" height="940" fill="#000000"/>
  <rect x="320" y="40" width="800" height="500" fill="url(#glow)"/>

  <!-- logo -->
  <g transform="translate(668,90)">
    <rect width="48" height="48" rx="13" fill="url(#red)"/>
    <path d="M19 14 L34 24 L19 34 Z" fill="#fff"/>
    <text x="60" y="33" font-size="26" font-weight="800" fill="#fff">Gen<tspan fill="#FF453A">Tube</tspan></text>
  </g>
  <text x="720" y="182" text-anchor="middle" class="sub">Paiement mobile money — à partir de 15 000 FCFA/mois. Aucune carte bancaire exigée.</text>

  <!-- ===== carte connexion (état erreur) ===== -->
  <g transform="translate(340,220)">
    <rect width="400" height="470" rx="18" class="card"/>
    <text x="28" y="46" class="h2">Connexion</text>
    <text x="28" y="68" class="mut">Content de te revoir.</text>

    <text x="28" y="106" class="lbl">EMAIL</text>
    <rect x="28" y="116" width="344" height="44" rx="10" class="field"/>
    <text x="44" y="143" class="body">awa@studio.test</text>

    <text x="28" y="192" class="lbl">MOT DE PASSE</text>
    <rect x="28" y="202" width="344" height="44" rx="10" class="field"/>
    <text x="44" y="229" class="body">••••••••••</text>
    <g transform="translate(338,214)" stroke="#6E6E73" stroke-width="1.5" fill="none"><path d="M2 8c3-5 13-5 16 0-3 5-13 5-16 0z"/><circle cx="10" cy="8" r="2.4"/></g>

    <rect x="28" y="262" width="344" height="40" rx="9" fill="#FF453A" fill-opacity=".1" stroke="#FF453A" stroke-opacity=".45"/>
    <text x="44" y="287" class="err">✕  Email ou mot de passe incorrect.</text>
    <text x="28" y="322" class="tiny">Le message ne dit jamais lequel des deux est faux.</text>

    <rect x="28" y="340" width="344" height="48" rx="12" fill="url(#red)"/>
    <text x="200" y="370" text-anchor="middle" class="btnT">Se connecter</text>
    <text x="200" y="416" text-anchor="middle" class="sub">Mot de passe oublié ?</text>
    <line x1="28" y1="436" x2="372" y2="436" stroke="#2A2A2D"/>
    <text x="200" y="456" text-anchor="middle" class="sub">Pas de compte ? <tspan fill="#FF453A" font-weight="700">Créer un workspace</tspan></text>
  </g>

  <!-- ===== carte inscription ===== -->
  <g transform="translate(700,220)">
    <rect width="400" height="470" rx="18" class="card"/>
    <text x="28" y="46" class="h2">Inscription</text>
    <text x="28" y="68" class="mut">Ton workspace est créé automatiquement.</text>

    <text x="28" y="100" class="lbl">NOM</text>
    <rect x="28" y="110" width="344" height="42" rx="10" class="field"/>
    <text x="44" y="136" class="mut">Awa Mensah</text>

    <text x="28" y="178" class="lbl">EMAIL</text>
    <rect x="28" y="188" width="344" height="42" rx="10" class="field"/>
    <text x="44" y="214" class="mut">awa@exemple.com</text>

    <text x="28" y="256" class="lbl">MOT DE PASSE</text>
    <rect x="28" y="266" width="344" height="42" rx="10" class="field"/>
    <text x="44" y="292" class="mut">8 caractères minimum</text>

    <rect x="28" y="330" width="344" height="48" rx="12" fill="url(#red)"/>
    <text x="200" y="360" text-anchor="middle" class="btnT">Créer mon workspace</text>
    <text x="200" y="404" text-anchor="middle" class="tiny">Vous devenez propriétaire (owner) du workspace.</text>
    <line x1="28" y1="424" x2="372" y2="424" stroke="#2A2A2D"/>
    <text x="200" y="446" text-anchor="middle" class="sub">Déjà un compte ? <tspan fill="#FF453A" font-weight="700">Se connecter</tspan></text>
  </g>

  <!-- états -->
  <text x="720" y="780" text-anchor="middle" class="lbl">ÉTATS DU FORMULAIRE</text>
  <g transform="translate(360,800)">
    <rect width="220" height="72" rx="12" class="card"/>
    <text x="16" y="28" font-size="11" font-weight="700" fill="#fff">Vide</text>
    <text x="16" y="48" class="tiny">Champs vides, bouton au repos.</text>
  </g>
  <g transform="translate(610,800)">
    <rect width="220" height="72" rx="12" class="card"/>
    <rect x="16" y="16" width="120" height="36" rx="10" fill="#FF453A" fill-opacity=".35"/>
    <text x="76" y="39" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">⟳ Connexion…</text>
    <text x="16" y="64" class="tiny">Bouton en chargement, champs désactivés.</text>
  </g>
  <g transform="translate(860,800)">
    <rect width="220" height="72" rx="12" class="card"/>
    <text x="16" y="26" class="err">✕ Email ou mot de passe incorrect.</text>
    <text x="16" y="46" class="tiny">Erreur sous le champ, sans préciser lequel.</text>
  </g>
</svg>
