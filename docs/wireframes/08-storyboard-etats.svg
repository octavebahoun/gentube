<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1220" viewBox="0 0 1180 1220" font-family="Plus Jakarta Sans, Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A4E"/><stop offset="1" stop-color="#CC0000"/>
    </linearGradient>
  </defs>
  <style>
    .h2{font-size:14px;font-weight:700;fill:#fff}
    .body{font-size:13px;fill:#E8E8ED}
    .sub{font-size:12px;fill:#A5A5AA}
    .mut{font-size:11px;fill:#8A8A92}
    .tiny{font-size:10px;fill:#4A4A4A}
    .lbl{font-size:10px;font-weight:700;fill:#6E6E73;letter-spacing:.12em}
    .btnT{font-size:13px;font-weight:700;fill:#fff}
    .card{fill:#1C1C1E;stroke:#2A2A2D}
    .field{fill:#0A0A0B;stroke:#2E2E32}
    .ghost{fill:none;stroke:#3A3A3E}
    .cap{font-size:12px;font-weight:800;fill:#6E6E73;letter-spacing:.1em}
  </style>
  <rect width="1180" height="1220" fill="#000000"/>

  <!-- ===== 1. VIDE ===== -->
  <text x="20" y="28" class="cap">1 · STORYBOARD VIDE</text>
  <g transform="translate(20,44)">
    <rect width="540" height="330" rx="16" class="card"/>
    <g transform="translate(270,110)">
      <circle r="40" fill="#1a0508" stroke="#FF453A" stroke-opacity=".55"/>
      <g transform="translate(-13,-13)" stroke="#FF453A" stroke-width="1.8" fill="none"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M10 9l6 3.5-6 3.5z"/></g>
    </g>
    <text x="270" y="192" text-anchor="middle" class="h2" font-size="16">Aucune scène pour l'instant.</text>
    <text x="270" y="216" text-anchor="middle" class="sub">Génère un premier jet, puis réécris ce que tu veux.</text>
    <rect x="170" y="244" width="200" height="44" rx="11" fill="url(#red)"/>
    <text x="270" y="271" text-anchor="middle" class="btnT">Générer le storyboard</text>
  </g>

  <!-- ===== 2. ÉCRITURE EN COURS ===== -->
  <text x="620" y="28" class="cap">2 · ÉCRITURE DU STORYBOARD (PLUSIEURS SECONDES)</text>
  <g transform="translate(620,44)">
    <rect width="540" height="330" rx="16" class="card"/>
    <circle cx="40" cy="44" r="11" fill="none" stroke="#FF453A" stroke-width="2.4" stroke-dasharray="42 28"/>
    <text x="64" y="49" class="h2">Écriture du storyboard…</text>
    <text x="64" y="68" class="tiny">Le modèle raisonne avant de répondre. L'ancien storyboard reste intact en cas d'échec.</text>
    <rect x="24" y="96" width="492" height="56" rx="10" fill="#141416" stroke="#26262A"/>
    <rect x="24" y="164" width="492" height="56" rx="10" fill="#141416" stroke="#26262A"/>
    <rect x="24" y="232" width="492" height="56" rx="10" fill="#141416" stroke="#26262A"/>
    <rect x="40" y="116" width="300" height="10" rx="5" fill="#26262A"/>
    <rect x="40" y="134" width="200" height="8" rx="4" fill="#1F1F23"/>
    <rect x="40" y="184" width="340" height="10" rx="5" fill="#26262A"/>
    <rect x="40" y="202" width="160" height="8" rx="4" fill="#1F1F23"/>
    <rect x="40" y="252" width="280" height="10" rx="5" fill="#26262A"/>
    <rect x="40" y="270" width="220" height="8" rx="4" fill="#1F1F23"/>
  </g>

  <!-- ===== 3. VOIX OFF EN COURS ===== -->
  <text x="20" y="424" class="cap">3 · ENREGISTREMENT DE LA VOIX (PLUSIEURS SECONDES PAR SCÈNE)</text>
  <g transform="translate(20,440)">
    <rect width="540" height="330" rx="16" class="card"/>
    <circle cx="40" cy="44" r="11" fill="none" stroke="#FF453A" stroke-width="2.4" stroke-dasharray="42 28"/>
    <text x="64" y="49" class="h2">Enregistrement de la voix…</text>
    <g transform="translate(24,76)">
      <rect width="492" height="44" rx="10" fill="#141416" stroke="#26262A"/>
      <text x="16" y="27" class="sub" font-weight="700">#1</text>
      <rect x="420" y="11" width="58" height="22" rx="11" fill="#32D74B" fill-opacity=".13"/>
      <text x="449" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#32D74B">mesurée</text>
    </g>
    <g transform="translate(24,130)">
      <rect width="492" height="44" rx="10" fill="#141416" stroke="#26262A"/>
      <text x="16" y="27" class="sub" font-weight="700">#2</text>
      <rect x="420" y="11" width="58" height="22" rx="11" fill="#32D74B" fill-opacity=".13"/>
      <text x="449" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#32D74B">mesurée</text>
    </g>
    <g transform="translate(24,184)">
      <rect width="492" height="44" rx="10" fill="#141416" stroke="#FF453A" stroke-opacity=".5"/>
      <text x="16" y="27" class="sub" font-weight="700">#3</text>
      <circle cx="436" cy="22" r="9" fill="none" stroke="#FF453A" stroke-width="2" stroke-dasharray="34 22"/>
      <text x="456" y="26" class="mut" font-size="10">voix…</text>
    </g>
    <text x="270" y="270" text-anchor="middle" class="tiny">3 scènes sur 5 enregistrées — l'écran reste lisible, aucune action bloquée.</text>
  </g>

  <!-- ===== 4. VOIX PARTIELLE ===== -->
  <text x="620" y="424" class="cap">4 · VOIX PARTIELLE (REPRISE)</text>
  <g transform="translate(620,440)">
    <rect width="540" height="330" rx="16" class="card"/>
    <text x="24" y="40" class="h2">Coût : <tspan fill="#FF453A">18</tspan> crédits estimés</text>
    <text x="24" y="62" class="tiny">2 scènes mesurées · 3 estimées — le total descend quand la voix avance.</text>
    <g transform="translate(24,84)">
      <rect width="492" height="40" rx="10" fill="#141416" stroke="#26262A"/>
      <text x="16" y="25" class="sub" font-weight="700">#1 · 5,28 s</text>
      <rect x="420" y="9" width="58" height="22" rx="11" fill="#32D74B" fill-opacity=".13"/>
      <text x="449" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#32D74B">mesurée</text>
    </g>
    <g transform="translate(24,134)">
      <rect width="492" height="40" rx="10" fill="#141416" stroke="#26262A"/>
      <text x="16" y="25" class="sub" font-weight="700">#4 · 5 s</text>
      <rect x="420" y="9" width="58" height="22" rx="11" fill="#8E8E93" fill-opacity=".15"/>
      <text x="449" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#C9C9CE">estimée</text>
    </g>
    <rect x="24" y="200" width="492" height="44" rx="11" fill="url(#red)"/>
    <text x="270" y="227" text-anchor="middle" class="btnT">🎙  Enregistrer la voix off</text>
    <text x="270" y="268" text-anchor="middle" class="tiny">Reprend là où c'est arrêté — les scènes déjà mesurées ne sont pas re-payées.</text>
  </g>

  <!-- ===== 5. SOLDE INSUFFISANT ===== -->
  <text x="20" y="820" class="cap">5 · SOLDE INSUFFISANT APRÈS MESURE</text>
  <g transform="translate(20,836)">
    <rect width="540" height="330" rx="16" class="card"/>
    <text x="24" y="44" class="h2">Coût exact : <tspan fill="#fff">25</tspan> crédits</text>
    <text x="24" y="66" class="tiny">5 scènes · toutes mesurées sur l'audio.</text>
    <rect x="24" y="90" width="492" height="44" rx="11" fill="#141416" stroke="#2A2A2D"/>
    <text x="270" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#6E6E73">Valider et débiter 25 crédits</text>
    <rect x="24" y="152" width="492" height="44" rx="10" fill="#FF453A" fill-opacity=".1" stroke="#FF453A" stroke-opacity=".45"/>
    <text x="40" y="179" font-size="12" font-weight="700" fill="#FF453A">Solde de 10 crédits — il manque 15. Recharge depuis la facturation.</text>
    <rect x="24" y="214" width="180" height="40" rx="10" fill="none" stroke="#FF453A" stroke-opacity=".65"/>
    <text x="114" y="239" text-anchor="middle" font-size="12" font-weight="700" fill="#FF453A">Recharger des crédits</text>
    <text x="270" y="292" text-anchor="middle" class="tiny">Le bouton Valider reste visible mais inerte : le blocage est expliqué, pas muet.</text>
  </g>

  <!-- ===== 6. VALIDÉE (LECTURE SEULE) ===== -->
  <text x="620" y="820" class="cap">6 · VIDÉO VALIDÉE — HISTORIQUE, PAS FORMULAIRE GRISÉ</text>
  <g transform="translate(620,836)">
    <rect width="540" height="330" rx="16" class="card"/>
    <rect x="0" y="0" width="540" height="330" rx="16" fill="none" stroke="#2A2A2D"/>
    <rect x="16" y="16" width="508" height="40" rx="10" fill="#32D74B" fill-opacity=".1" stroke="#32D74B" stroke-opacity=".4"/>
    <text x="32" y="41" font-size="12" font-weight="700" fill="#32D74B">✓  Cette vidéo est validée — 25 crédits ont été débités.</text>
    <g transform="translate(24,84)">
      <text x="0" y="12" class="tiny">#1 · 5,28 s · mesurée</text>
      <text x="0" y="34" class="body">Au XVIIᵉ siècle, un royaume d'Afrique de l'Ouest confie sa garde à des femmes.</text>
      <text x="0" y="54" class="mut">Wide establishing shot of the royal palace of Abomey at dawn…</text>
    </g>
    <line x1="24" y1="164" x2="516" y2="164" stroke="#26262A"/>
    <g transform="translate(24,184)">
      <text x="0" y="12" class="tiny">#2 · 5,1 s · mesurée</text>
      <text x="0" y="34" class="body">On les appelle les Amazones. Elles s'entraînent chaque jour, pieds nus.</text>
      <text x="0" y="54" class="mut">Amazon warriors training in formation, dust rising, slow motion.</text>
    </g>
    <text x="270" y="298" text-anchor="middle" class="tiny">Textes figés en lecture — pas de champs désactivés, pas de flèches, pas de corbeille.</text>
  </g>

  <text x="590" y="1204" text-anchor="middle" class="tiny">Erreur du modèle (état 2 en échec) : message rouge au niveau du bouton Générer — « Le modèle a renvoyé quelque chose d'inutilisable. Réessaie. » — scènes intactes.</text>
</svg>
