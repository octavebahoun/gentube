  <text x="296" y="110" class="link">←  Histoires du Bénin</text>
  <text x="296" y="144" class="h1">Les Amazones du Dahomey</text>
  <rect x="530" y="126" width="90" height="24" rx="12" fill="#32D74B" fill-opacity=".13"/>
  <circle cx="544" cy="138" r="3" fill="#32D74B"/>
  <text x="552" y="142" font-size="11" font-weight="600" fill="#32D74B">rendue</text>

  <!-- ===== publication ===== -->
  <text x="296" y="192" class="lbl">PUBLIER</text>
  <g transform="translate(296,208)">
