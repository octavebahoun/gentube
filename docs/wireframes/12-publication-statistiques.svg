      <text x="300" y="18" class="sub">8 214</text><text x="360" y="18" class="sub">610</text>
    </g>
    <line x1="24" y1="580" x2="400" y2="580" stroke="#26262A"/>
    <g transform="translate(24,590)">
      <text x="0" y="18" class="sub">Démo — Abomey en 60 s</text>
      <text x="300" y="18" class="sub">1 902</text><text x="360" y="18" class="sub">154</text>
    </g>
    <text x="24" y="660" class="tiny">État vide : « Aucune vidéo publiée pour l'instant. »</text>
    <text x="24" y="680" class="tiny">Rafraîchissement : « Statistiques en cours de récupération — mises à jour une fois par jour. »</text>
    <text x="24" y="720" class="lbl">HISTORIQUE DATÉ</text>
    <text x="24" y="744" class="tiny">Chaque jour est archivé : la courbe compte plus que le chiffre du jour.</text>
