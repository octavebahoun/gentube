    <rect x="24" y="24" width="592" height="260" rx="12" fill="url(#thumb)"/>
    <circle cx="320" cy="140" r="44" fill="url(#red)"/>
    <path d="M305 120 L348 140 L305 160 Z" fill="#fff"/>
    <rect x="24" y="240" width="592" height="44" fill="#000" fill-opacity=".55"/>
    <text x="40" y="268" class="sub" font-weight="700">0:30 · 480p · MP4 final sur R2</text>
    <text x="24" y="322" class="lbl">TITRE YOUTUBE</text>
