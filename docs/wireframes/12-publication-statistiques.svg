      <text x="368" y="18" class="mut" opacity=".7">14 sept. 2026 · 09:00</text>
    </g>
    <rect x="24" y="776" width="592" height="48" rx="12" fill="url(#red)"/>
    <text x="320" y="806" text-anchor="middle" class="btnT">Publier sur la chaîne</text>
    <text x="24" y="856" class="tiny">Destination : <tspan fill="#32D74B" font-weight="700">✓ Histoires du Bénin</tspan> — chaîne connectée. Aucun doute sur où ça part.</text>
    <text x="24" y="896" class="lbl">VARIANTE · PROGRAMMÉE</text>
    <rect x="24" y="906" width="592" height="36" rx="9" fill="#FFD60A" fill-opacity=".1" stroke="#FFD60A" stroke-opacity=".4"/>
    <text x="40" y="929" font-size="11" font-weight="700" fill="#FFD60A">⏱  Programmée — publiera le 14 sept. à 09:00.</text>
    <text x="600" y="929" text-anchor="end" font-size="11" font-weight="700" fill="#FFD60A">Annuler</text>
  </g>

