    <g transform="translate(24,634)">
      <circle cx="8" cy="10" r="8" stroke="#FF453A" fill="none" stroke-width="1.6"/><circle cx="8" cy="10" r="3.5" fill="#FF453A"/>
      <text x="26" y="14" class="body">Publique</text>
      <circle cx="140" cy="10" r="8" class="ghost" stroke-width="1.6"/><text x="158" y="14" class="body">Non répertoriée</text>
      <circle cx="322" cy="10" r="8" class="ghost" stroke-width="1.6"/><text x="340" y="14" class="body">Privée</text>
    </g>
    <text x="24" y="698" class="lbl">QUAND</text>
