    .body{font-size:13px;fill:#E8E8ED}
    .sub{font-size:12px;fill:#A5A5AA}
    .mut{font-size:11px;fill:#8A8A92}
    .tiny{font-size:10px;fill:#4A4A4A}
    .lbl{font-size:11px;font-weight:600;fill:#8A8A92;letter-spacing:.08em}
    .nav{font-size:13px;font-weight:600;fill:#A5A5AA}
