    <text x="40" y="358" class="body">Les Amazones du Dahomey — l'armée de femmes oubliée</text>
    <text x="24" y="404" class="lbl">DESCRIPTION</text>
    <rect x="24" y="414" width="592" height="88" rx="10" class="field"/>
    <text x="40" y="440" class="body">L'histoire des Agojié, les guerrières du royaume du Dahomey,</text>
    <text x="40" y="460" class="body">de leur fondation à la conquête française. #histoire #bénin</text>
    <text x="24" y="532" class="lbl">MOTS-CLÉS</text>
    <rect x="24" y="542" width="592" height="42" rx="10" class="field"/>
    <text x="40" y="568" class="mut">histoire, dahomey, bénin, amazones…</text>
