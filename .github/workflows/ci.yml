name: CI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - ai-video-saas
      - 'bot/**'

jobs:
  typecheck-and-test:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
        env:
          # Tests require these minimal env vars to pass
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
          EDGE_TTS_DISABLED: '1'
